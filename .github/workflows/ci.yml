name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jarvis_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TESTE: postgres://postgres:postgres@localhost:5432/jarvis_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Chromium para os testes da Fase 2
        run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Tipagem
        run: npm run typecheck
      - name: Testes (inclui critérios de aceite da Fase 0)
        run: npm test
      - name: Build do painel
        run: npm run build -w @jarvis/painel
