# Item 792: escada de modelos. Seleção: override explícito da chamada > mapa por finalidade > heurística de complexidade.
# Opus fica desligado: só sai com permitir_opus: true (e nunca é usado como fallback de servidor sobrecarregado).
modelos:
  permitir_opus: false
  degraus:
    haiku: claude-haiku-5-5
    sonnet: claude-sonnet-5-5
    opus: claude-opus-5-5
  por_finalidade:
    conversa: haiku   # WhatsApp/painel: respostas curtas com tools
    plano: sonnet     # Maestro: JSON de plano validado
    oferta: sonnet    # produção de produto/página/anúncio
    proativo: sonnet  # item 829: agente proativo (propostas de ação)
    fatos: haiku      # item 845: extrator de fatos duráveis (barato, roda depois de cada conversa/tarefa)
  heuristica:         # só para finalidade fora do mapa
    prompt_medio_chars: 6000      # +1 ponto
    prompt_grande_chars: 20000    # +2 pontos
    tools_medio: 6                # +1 ponto
    tools_muitos: 12              # +2 pontos
    pontos_por_categoria: 2       # raciocínio, código ou dinheiro no texto
    subir_sonnet_a_partir: 2
    subir_opus_a_partir: 6        # só vale com permitir_opus
    palavras:
      raciocinio: [analise, analisar, compar, estrateg, planej, diagnostic, investig, otimiz, "passo a passo", "por que", tradeoff, priorizar]
      codigo: [codigo, funcao, typescript, refator, migration, "stack trace", bug, sql, regex, algoritmo, implement]
      dinheiro: ["r$", preco, pagamento, reembolso, orcamento, fatura, imposto, comissao, margem, cobranca, pix, estorno]
  fallback:
    status_transitorios: [429, 500, 502, 503, 504, 529]   # status 0 (rede/timeout) sempre conta
    tentativas_por_degrau: 2     # 1 tentativa + 1 repetição com backoff curto, depois troca de degrau
    backoff_inicial_ms: 300
    backoff_maximo_ms: 2000
    max_trocas: 2

# Item 792: LoopGuard (conversa com tools e executor). Dispara: interrompe, audita e devolve o motivo.
loop_guard:
  ativo: true
  max_chamadas_mesma_tool: 8     # mesma tool por tarefa/conversa
  repeticoes_ciclo: 2            # A,B,A,B
  rodadas_sem_progresso: 3
  executor_janela_minutos: 30    # executor: escopo (plano/negócio) parado por tanto tempo recomeça do zero
  executor_max_mesma_acao: 20    # executor: mesma ação por escopo

# Item 829: agente proativo. Junta contexto a cada `intervalo_h` horas e PROPÕE ações; toda proposta nasce pendente de
# aprovação (nada executa sozinho). Desligado por padrão. Não roda com PARA TUDO ativo nem na janela de silêncio.
proativo:
  ligado: false
  intervalo_h: 5
  silencio:                       # sem rodar e sem avisar nesse horário (fuso abaixo)
    ativo: true
    inicio_h: 22
    fim_h: 7
    fuso: America/Sao_Paulo
  max_propostas: 3                # por rodada (soma das empresas)
  dias_dedup: 7                   # não repropõe o mesmo (título+ação) pendente ou criado/recusado nesse prazo
  expira_em_horas: 24             # validade do pedido de aprovação de cada proposta
  teto_custo_mensal_brl: 50       # gasto do próprio agente (llm_chamadas, finalidade proativo); acima disso não roda

# Item 845: extrator de fatos duráveis. Depois de cada conversa e de cada tarefa concluída, a IA (Haiku) tira fatos curtos
# (preferência, decisão, negócio, cliente, regra) e grava na memória. Nunca grava segredo/CPF/telefone/cartão; fato vindo de
# conteúdo externo entra com taint e confiança reduzida e nunca como preferência/regra do Breno. Não bloqueia a resposta.
fatos:
  ligado: true
  limiar_confianca: 0.6        # abaixo disso o fato é descartado (depois do fator de taint)
  max_fatos_por_texto: 5
  tamanho_min_texto: 25        # texto menor que isso nem chama a IA ("ok", "valeu")
  fator_taint: 0.7             # multiplica a confiança de fato derivado de conteúdo externo
  similaridade_dedup: 0.8      # parecido o bastante para contar como o mesmo fato (só atualiza visto_em/contagem)

emergencia:
  comando_whatsapp: "PARA TUDO"
  revogar_tokens: [jarvis, carteiro, marcapasso]
