# Item 793: servidores MCP externos que o Jarvis consome (cliente MCP).
# - Allowlist de tools OBRIGATÓRIA: tool fora da lista nunca é exposta ao cérebro nem chamada.
# - Risco de cada tool: semáforo do config/regras.yaml, pela ação mcp_<servidor>_<tool>.
#   Verde executa; amarelo/vermelho NÃO executam direto (exigem aprovação); sem entrada no semáforo = vermelho.
# - URL e token vêm do ambiente (url_env / token_env). Servidor sem URL no ambiente fica desligado.
versao: 1

servidores:
  openjarvis:
    ativo: true
    descricao: OpenJarvis (calculadora, think, busca na web, leitura de arquivo, memória; adaptador deploy/openjarvis/mcp_http.py)
    url_env: JARVIS_CORE_OPENJARVIS_MCP_URL
    token_env: JARVIS_CORE_OPENJARVIS_MCP_TOKEN
    timeout_ms: 30000
    tools:
      - calculator
      - think
      - web_search
      - file_read
      - memory_search
      - memory_retrieve
      - deep_research # amarelo: gasta tokens, até 10 min; só roda depois da aprovação do Breno
      - morning_digest # verde
    # Timeout por tool (ms). Sem entrada, vale timeout_ms. Na conversa o prazo do laço (20 s) continua mandando;
    # o valor cheio vale na execução depois da aprovação (worker).
    timeouts_ms:
      deep_research: 600000

  # Desligado por padrão. O Nexus já tem o cliente próprio assinado por HMAC (nexus-mcp.ts, usado na conversa);
  # só ligue esta entrada se o /api/mcp do Nexus passar a aceitar token Bearer.
  nexus:
    ativo: false
    descricao: Nexus (Quadro de Pedidos, Atlas, saúde e banco só leitura)
    url_env: JARVIS_CORE_NEXUS_MCP_URL
    token_env: JARVIS_CORE_NEXUS_MCP_TOKEN
    timeout_ms: 20000
    tools:
      - pedidos_buscar_parecidos
      - pedidos_listar
      - pedidos_ver
      - pedidos_criar
      - pedidos_atualizar
      - atlas_buscar
      - atlas_gravar
      - sistema_saude
      - banco_tabelas
      - banco_consultar
