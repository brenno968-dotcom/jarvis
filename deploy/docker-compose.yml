# Trecho do Jarvis para o docker-compose do VPS (seção 23 de docs/JARVIS.md).
# WhatsApp e Vigia continuam nos containers deles; cada um com limite de memória próprio.
services:
  jarvis-worker:
    image: jarvis-worker:latest
    container_name: jarvis-worker
    restart: unless-stopped
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 768m
    cpus: "0.5"
    environment:
      - BWS_ACCESS_TOKEN_FILE=/run/secrets/bws_token
      - JARVIS_WORKER_ID=vps-hostinger-1
      # DATABASE_URL vem da Dory (bws run). Não colocar valor aqui.
    secrets:
      - bws_token
    networks:
      - default
      - jarvis-interna
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Piloto OpenJarvis (Item 808): MCP HTTP interno, sem porta publicada.
  # Build: docker build -f deploy/openjarvis/Dockerfile -t openjarvis-mcp:latest .
  # Worker acessa em http://openjarvis:8765/mcp (JARVIS_CORE_OPENJARVIS_MCP_URL).
  openjarvis:
    image: openjarvis-mcp:latest
    container_name: openjarvis
    restart: unless-stopped
    user: "1002:1002"
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: "0.5"
    # Sem "ports:" de proposito. Segredos vem do env do VPS (bws run), nunca daqui.
    environment:
      - ANTHROPIC_API_KEY          # so necessaria se for usar engine cloud; o MCP de tools nao a usa
      - OPENJARVIS_MCP_TOKEN       # Bearer exigido nas chamadas ao /mcp
    volumes:
      - openjarvis-data:/data
    networks:
      - jarvis-interna
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  openjarvis-data:

networks:
  jarvis-interna:
    driver: bridge

secrets:
  bws_token:
    file: /opt/jarvis/secrets/bws_token   # permissão 600, dono 1001
